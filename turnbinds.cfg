//  centralized turnbind cfg to be shared with any game featuring cl_yawspeed.
//  I moved this to a separate file so changes are easy and consistent across cs:s, momentum etc.
//  put this file in Steam/steamapps and add a link/shortcut to it in each game's cfg folder
//  then add  exec turnbinds.cfg  to your surf cfg(s)

// cl_yawspeed is locked to 210/140.7-ish (degrees per second) in CSGO/CS2

alias "yaw"  "cl_yawspeed 42"   // set your normal yaw speed here. default is 210.
alias "syaw" "cl_yawspeed 165" // shift yaw speed. default +speed behaviour is yawspeed x0.67-ish

// temporary change is possible in-game by e.g. "alias yaw cl_yawspeed 80" in console
// see also: yawspeed alias presets below
alias "tr" "exec turnbinds.cfg" // set yawspeed by editing this file and running "tr" in console.
yaw // apply your yawspeed settings upon .cfg exec



// yawspeed shift
//
alias "+yawspd" "syaw"
alias "-yawspd" "yaw"
//
bind "SHIFT" "+yawspd" // yaw speed shift key < < < < < < < < < < < < < < < < < < < < < <


// yawspeed toggle with feedback sound
//
alias "yaws1" "yaw;alias yawtog yaws2;playvol buttons\button15 0.7"
alias "yaws2" "syaw;alias yawtog yaws1;playvol buttons\blip1 0.6"
//yaws1
//bind "" "yawtog" // speed toggle key  < < < < < < < < < < < < < < < < < < < < < < < < <



// turn bind toggle - swap between mouse button turn binds or regular mouse shoot
//
alias "crnk" "playvol buttons/lever7 .5"
alias "trn" "bind mouse1 +left;bind mouse2 +right;alias tbnd pew;crnk"
// set turn key here ^     and here ^  and define m1/m2 below < < < < < < < < < < < < < <
//
bind mouse1 +left  // m1/m1 turnbinds on by default
bind mouse2 +right
//
alias "pew" "bind mouse1 +attack;bind mouse2 +attack2;alias tbnd trn;offsnd"
alias "tbnd" "pew"
//
bind "rctrl" "tbnd" // bind toggle key  < < < < < < < < < < < < < < < < < < < < < < < < <



// yawspeed aliases - enter e.g. "50" into console to temporarily change yaw speed while playing
// these aliases can also be bound to keys, allowing yaw settings to be changed without console:
