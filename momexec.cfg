// Momentum Mod cfg
//
// this is game in development and so is my config! I am not 100% certain that everything works as intended.
// input behaviour and game commands have changed multiple times and may continue to do so.
//
// https://store.steampowered.com/app/669270/Momentum_Mod/


unbindall // WARNING: consider saving your current binds, settings and crosshair in a cfg before running this


// Aim
//
sensitivity 0.320 // 2000DPI for 65cm/360 (640eDPI) high DPI at low sens for fine, responsive aim input
zoom_sensitivity_ratio_mouse 0.818666 // consistent perceptual sensitivity, scoped or not, near crosshair
m_customaccel_scale 0
m_rawinput 2 // 0 allows desktop settings to affect aim, 1 direct mouse input, 2 is a new version of that
m_yaw 0.022 // default is 0.022 degrees rotation per mouse input tick/dot/calculation


// Turn bind cfg - mouse button turn bind/regular mouse shoot toggle and yawspeed shift alias. cfg required:
// https://github.com/henrym11106/CSGO-autoexec/blob/master/turnbinds.cfg
//
exec turnbinds.cfg
alias "tr" "exec turnbinds.cfg"




// movement binds
//
bind e "+forward"
bind d "+back"
bind s "+moveleft"
bind f "+moveright"


mom_null_binds 1 //  "nulls"  1 = game prioritizes the last movement key pressed, 0 = default behaviour
mom_release_forward_on_jump 1 // lj bind, makes starts/prestrafing etc more consistent


// Duckjump bind - tap ctrl to un-duck while bhopping. ctrl always ducks and un-ducks. also:
// auto hop toggle: bhop without holding space/+jump, mousewheel up or respawn key to stop jumping
//
alias "dk" "toggle_duck"
alias "tdk" "toggle_duck"
alias "+tdkstrt" "tdk; alias dk; alias tdk"
alias "-tdkstrt" "toggle_duck; alias dk toggle_duck; alias tdks; alias tdk toggle_duck"
alias "tdknd" "alias tdk toggle_duck; alias tdks"
alias "tdks" ""
bind "ctrl" "+tdkstrt"
alias "tjmp" "toggle_jump"
alias "tjmps" ""
alias "+jmstrt" "tjmp; tdk; alias tjmp; alias tjmps toggle_jump; alias tdk; alias tdks dk"
alias "-jmstrt" "tjmps; tdks; alias tjmp toggle_jump; alias tjmps; alias tdks; alias tdk dk"
alias "+tjmstrt" "tjmp; tdk; alias tjmp; alias tjmps; alias tdk; alias tdks dk"
alias "-tjmstrt" "tdks; alias tjmp; alias tjmps toggle_jump; alias tdks; alias tdk dk"
alias "tjmpnd" "alias tjmp toggle_jump; alias tjmps"
alias "tjmpon" "bind space +tjmstrt; alias jtog tjmpoff;play player\suit_sprint"
alias "tjmpoff" "bind space +jmstrt;alias jtog tjmpon;offsnd"
alias "offsnd" "playvol buttons/combine_button2 .8"
bind "MWHEELUP" "tjmps; tjmpnd" // scroll up to stop jumping
bind "MWHEELDOWN" "+jump" // scroll jump
alias "jtog" "tjmpon"
bind "space" "+jmstrt" // jump key, auto jump off by default. change to +tjmstrt for autojump
bind "\" "jtog" // key to toggle auto jump





// Timer and teleport binds
//
bind "t" "mom_restart_track;tjmps; tjmpnd" // teleport to map start, stop autohopping
bind "q" "mom_restart_stage;tjmps; tjmpnd" // restart map or bonus, stop autohopping
bind "m" "mom_start_mark_set"      // set respawn position per start zone (startpos)
bind "j" "mom_practice;playvol buttons/combine_button1 .6" // toggle noclip for some reason lol
bind "[" ""
bind "]" ""


// use number keys to teleport to bonuses, + hold tab for stages
//
alias "sm_s1" "mom_stage 1;bind q sm_s1"
alias "sm_s2" "mom_stage 2;bind q sm_s2"
alias "sm_s3" "mom_stage 3;bind q sm_s3"
alias "sm_s4" "mom_stage 4;bind q sm_s4"
alias "sm_s5" "mom_stage 5;bind q sm_s5"
alias "sm_s6" "mom_stage 6;bind q sm_s6"
alias "sm_s7" "mom_stage 7;bind q sm_s7"
alias "sm_s8" "mom_stage 8;bind q sm_s8"
alias "sm_s9" "mom_stage 9;bind q sm_s9"
alias "sm_s10" "mom_stage 10;bind sm_s10"
alias "sm_s11" "mom_stage 11;bind q sm_s11"
alias "sm_b1" "mom_bonus 1; rmap"
alias "sm_b2" "mom_bonus 2; rmap"
alias "sm_b3" "mom_bonus 3; rmap"
alias "sm_b4" "mom_bonus 4; rmap"
alias "sm_b5" "mom_bonus 5; rmap"
alias "sm_b6" "mom_bonus 6; rmap"
alias "sm_b7" "mom_bonus 7; rmap"
alias "sm_b8" "mom_bonus 8; rmap"
alias "sm_b9" "mom_bonus 9; rmap"
alias "sm_b10" "mom_bonus 10; rmap"
alias "sm_b11" "mom_bonus 11; rmap"
alias "+scoretp" "+showtimes;bind 1 sm_s1;bind 2 sm_s2;bind 3 sm_s3;bind 4 sm_s4;bind 5 sm_s5;bind 6 sm_s6;bind 7 sm_s7;bind 8 sm_s8;bind 9 sm_s9;bind 0 sm_s10;bind - sm_s11"
alias "-scoretp" "-showtimes;bind 1 sm_b1;bind 2 sm_b2;bind 3 sm_b3;bind 4 sm_b4;bind 5 sm_b5;bind 6 sm_b6;bind 7 sm_b7;bind 8 sm_b8;bind 9 sm_b9;bind 0 sm_b10;bind - sm_b11"
-scoretp
bind "TAB" "+scoretp"


// saveloc binds, practice mode
//
bind "LEFTARROW" "mom_savestate_prev" // toggle active saveloc
bind "RIGHTARROW" "mom_savestate_next"
bind "UPARROW" "mrset"
bind "DOWNARROW" "srset"
bind "v" "mom_savestate_create"
bind "c" "mom_savestate_create"
bind "b" "mom_savestate_create"
bind "n" "mom_savestate_create"
alias "brnt" "play player\vo\anarchist\t_molotov07"
alias "doit" "play player\vo\phoenix\peptalk01"
alias "letsgo" "play player\vo\phoenix\radio_letsgo02"
alias "loc" "bind q mom_savestate_load;bind t mom_savestate_load;unbind p;bind z nloc;doit"
alias "nloc" "bind q srset;bind t mrset;unbind z;bind p loc;letsgo"
bind "p" "loc" // enable practice mode and binds, press "Z" to leave practice mode.




// Misc binds
//
bind r "+use"
bind DEL "r_cleardecals" // erase all player-created or dynamic paint, blood, bullet holes etc
bind "F1" "invprev"
bind "F2" "invnext" // +attack bind is set by a toggle in turnbinds.cfg, see line 21 above
bindtoggle "F3" "cl_showpos"
bindtoggle "F4" "net_graph"
bind F11 "toggleconsole"  // open console while chat is open
bind y "chat_open"      // open chat
bind F5 "jpeg mom 97" // save quality 97 jpg as mom(#) in /steamapps/common/Momentum Mod Playtest/momentum/screenshots/
bind "`" "toggleconsole"
cl_showpos 0
net_graph 0
volume 0.255
voice_scale 0.85  //  VOIP volume
//bind "F8" "" //
//bind "F9" "" //
//bind "." "sm_flashlight"
//bind "," ""




// Video, HUD
//
fps_max 864 // I am using external FPS limiter libstrangle at 432fps (3x 144Hz refresh, linux)
fps_max_menu 144
sleep_when_meeting_framerate 0
mom_hud_speedometer_refresh_rate 24
//bind "i" "mom_hud_speedometer_enable" // speedo
//bind "k" "mom_hud_keypress_enable;play player\vo\anarchist\killedfriend03" // show your key inputs
mom_practice_warning_enable 1
cl_ejectbrass 0
r_dynamic 0
mat_disable_bloom 1
bind "F7" "toggle cl_showfps 2 0"
//bind "F6" "toggle fps_max 0 600 400"
//ent_remove postprocess_controller


// change gamma/brightness quickly - surf and bhop maps have a wide range of average brightness levels
//
bind "o" "toggle mat_brightness 1.1 1.0 0.86 1.6 1.4 1.2"
mat_brightness 1.2




// CS:S style crosshair
//
cl_crosshair_drawoutline 0
cl_crosshair_color 200 200 200 200
cl_crosshair_dot 1
cl_crosshair_gap 9
cl_crosshair_size 0.5
cl_crosshair_thickness 1




// toggle show weapons and cl_showpos (useful for painting) and +draw bind
//
alias "swepsd" "r_drawviewmodel 1;bind v +paint;cl_showpos 1;alias swpsd hwepsd"
alias "hwepsd" "r_drawviewmodel 0;bind v mom_saveloc_create;cl_showpos 0;alias swpsd swepsd"
alias "swpsd" "swepsd"
bind "MOUSE3" "swpsd"


mom_paint_color 0 255 0 255 // R G B Alpha?
mom_paint_normal_based_color 0 // color varies on edges of geometry etc
mom_paint_world_only 0 // paint anything
mom_paint_sound_enable 0




// Set tickrate and airaccel (launch game with -mapping option then use before and after map load)
//
alias "64t" "sv_airaccelerate 150; sv_interval_per_tick 0.015625000" // CS:GO default
alias "66t" "sv_airaccelerate 150; sv_interval_per_tick 0.015000000" // 66.7 Source engine default
alias "72t" "sv_airaccelerate 402; sv_interval_per_tick 0.013671875" // actually 73.14 (CS:GO)
alias "85t" "sv_airaccelerate 425; sv_interval_per_tick 0.011718750" // actually 85.33 (CS:GO)
alias "100t" "sv_airaccelerate 1000; sv_interval_per_tick 0.010000000" // 100 tick CS:S
alias "102t" "sv_airaccelerate 1000; sv_interval_per_tick 0.009765625" // 100t in CS:GO is 102.4
alias "128t" "sv_airaccelerate 1000; sv_interval_per_tick 0.007812500" // 128 tick CS:GO
alias "1000t" "sv_airaccelerate 10000; sv_interval_per_tick 0.001000000" // lol
//sv_interval_per_tick 0 // default tickrates




// Network
//
cl_interpolate 1 // interpolate player positional data. set to 0 and everything moves at server tickrate
net_splitrate 1 // max fragments per sv frame, default 1
cl_predict 1
//cl_cmdrate 100
//cl_updaterate 100




// disable surf map bhop speed restriction locally
alias "bhop" "sv_cheats 1;mom_mv_limit_jump_speed_factor 0"
//bind "" bhop


sv_cheats 0
alias "dc" "disconnect"
//alias "zn" "exec mom_zone.cfg" // easily enable map zoning mode and binds with that cfg file
alias "sf" "exec momexec.cfg" // restore normal binds and settings by executing this cfg
