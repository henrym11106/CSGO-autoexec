// CS2 config in-progress.
// be aware that commands in this file change audio and movement behaviour, read and understand before using!
//
// adding "//" to a line makes the text after it a comment, preventing it from being applied as a command
// put this file (autoexec.cfg) in steamapps/common/Counter-Strike Global Offensive/game/csgo/cfg
// you may need to run exec cs2exec or add "+exec cs2exec" to your launch options to use this cfg.
//
// many commands in this file also work in other source and goldsrc games, some even work in classic Quake

//unbindall // also unbinds mouse aim in CS2???


// Aim
//
sensitivity 0.32 // 2000DPI for 65cm/360 (640eDPI) use high DPI at low sens for fine, responsive aim input
zoom_sensitivity_ratio 0.818666 // consistent perceptual sensitivity, scoped or not, near crosshair
cl_debounce_zoom false  //  false=hold +attack2 to cycle scope/zoom (classic)  true=click for each change
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"



// Audio
//
snd_mixahead "0.01" // audio latency. sound crackles when set too low. 0.025 default but might not do anything in CS2
snd_mapobjective_volume "0" // post plant music level
snd_deathcamera_volume "0"
snd_roundend_volume "0"
snd_roundstart_volume "0"
snd_mute_losefocus "0"

// +attack Sound Compression - set +attack key, sound volume and VOIP levels here.
// 0.250 results in about a -25dB AK47 spray, volume x √2 = 3dB louder
//
alias +shootvol "cl_crosshair_recoil 1;volume 0.280;snd_voipvolume 0.777;+attack" // follow recoil, low vol, high VOIP when spraying
alias -shootvol "cl_crosshair_recoil 0;volume 0.400;snd_voipvolume 0.550;-attack" // fixed xhair, normal volume and VOIP level
bind MOUSE1 "+shootvol"
//
// +5dB volume, -6dB VOIP & 10-second warning when walking - set volume, walk key & 10-second volume here
alias +walkvol "volume 0.710;snd_tensecondwarning_volume 0.200;snd_voipvolume 0.255;+sprint" // boosted volume
alias -walkvol "volume 0.400;snd_tensecondwarning_volume 0.400;snd_voipvolume 0.550;-sprint" // normal volume
bind "SHIFT" "+walkvol"

// Reset audio if it drops out (Linux) - set accourding to your hardware; run "sound_device_override" in console to show your device,
// then change output device in settings and repeat. put alt output device after +sndrset and your normal output after -sndrset below.
//
alias +sndrset "sound_device_override Source2SDLDefaultDevice"
alias -sndrset "sound_device_override Starship/Matisse HD Audio Controller Analog Stereo"
bind F1 +sndrset // tap this key to reset audio output while playing



// Video
//
fps_max "0" // def. was 300, now 400. I'm using an external limiter
fps_max_ui "72" // they renamed fps_max_menu...
r_player_visibility_mode "1" // boost player contrast
cl_teamid_overhead_mode "1" //  show team equipment.
cl_autohelp "0"
gameinstructor_enable "0"
r_drawtracers_firstperson false
r_fullscreen_gamma 1.86 // 105% brightness, default 2.0 (100%)



// HUD
//
cl_hud_color "1"
cl_showloadout "1"
cl_radar_icon_scale_min "0.50" // Radar dot size
hud_scaling "0.950000" // size of all hud elements, not including crosshair. def 0.85
hud_showtargetid "1"
cl_teamid_overhead_mode "2" // 1=pips; 2=pips, name, health; 3=pips, name, health & equipment
cl_showfps 0
cl_hud_telemetry_frametime_poor 9.0
cl_hud_telemetry_frametime_show 2


// Cyan crosshair & Red Dot scope
//
cl_sniper_delay_unscope "false"
cl_sniper_auto_rezoom "true"
cl_crosshair_sniper_width "1"
cl_sniper_show_inaccuracy true
cl_ironsight_dot_scale "0.71"
cl_crosshair_drawoutline "1" // outline allows light xhairs to be clearly visible in bright areas
cl_crosshair_dynamic_splitdist "7"
cl_crosshair_friendly_warning "0"
cl_crosshair_outlinethickness "1.0"
cl_crosshair_t "0"
cl_crosshairalpha "141" // low alpha improves target visibility, especially in dark areas
cl_crosshaircolor "4" // 1=green, 2=yellow, 4=cyan
cl_crosshaircolor_b "0"
cl_crosshaircolor_g "0" // no work anymore
cl_crosshaircolor_r "255"
cl_crosshairdot "0" // dot can hurt visibility for tight & headshot angles, small gap is better
cl_crosshairgap "-2.0" // a reticle with a small gap is the easiest to read quickly in my experience
cl_crosshairgap_useweaponvalue "0"
cl_crosshairsize "2.0"
cl_crosshairstyle "4"
cl_crosshairthickness "0.5"
cl_crosshairusealpha "1"


// Show map overview with scoreboard
//
//alias "+scoremap" "+showscores;cl_radar_always_centered 0;cl_radar_scale 1.00;cl_hud_radar_scale 0.80;cl_radar_rotate 0"  // set map scale
//alias "-scoremap" "-showscores;cl_radar_always_centered 1;cl_radar_scale 0.50;cl_hud_radar_scale 1.14;cl_radar_rotate 1" // normal zoom & hud settings
//cl_radar_square_with_scoreboard 1;bind "TAB" "+scoremap"
//
// OR
//
// Zoom out Radar with scoreboard, set Radar zoom and behaviour if desired
alias "+scoremap" "+showscores;cl_radar_always_centered 0;cl_radar_scale 0.33;cl_hud_radar_scale 0.95;cl_radar_rotate 1;cl_teamid_overhead_mode 2"  // zoom out & decenter
alias "-scoremap" "-showscores;cl_radar_always_centered 1;cl_radar_scale 0.50;cl_hud_radar_scale 1.14;cl_radar_rotate 1;cl_teamid_overhead_mode 1" // normal zoom & hud settings
cl_radar_square_with_scoreboard 0;bind "TAB" "+scoremap"



// Viewmodel
//
//cl_bobamt_lat 0.060000  // cl_bobamt_lat/vert affects scoped crosshair sway/bob
//cl_bobamt_vert 0.060000 // RIP bob
//cl_bob_lower_amt 6
viewmodel_offset_x -0.666000
viewmodel_offset_y -2
viewmodel_offset_z -2
viewmodel_fov 66.666000
viewmodel_presetpos "0"




// Movement
//
bind e "+forward" // default movemnt keys = wasd
bind d "+back"
bind s "+left"
bind f "+right"
//
bind space +jump  // +djmp    // DuckJump key (RIP)
bind ctrl +duck  // +crouch  // Duck key
bind lwin +duck // +crouch  // Duck key
bind "MWHEELDOWN" "+jump"  // Scroll jump/bhop
bind "MOUSE4" "+jump"     // workaround for mwheel bug in older games, might be redundant in CS2
bind "MOUSE5" "+jump"    // my m4 & m5 buttons are mapped to home and end keys
option_speed_method "0" // 0=hold, 1=tap to toggle
option_duck_method "0" // 0=hold, 1=tap to toggle



// Quick Switch, use Primary weapon
//
alias +qsw1ch "slot3"
alias -qsw1ch "slot1"
bind "b" "+qsw1ch"
//bind "b" "slot1"


bind "MWHEELUP" "slot1"    // scroll up for accidental jump prevention
bind "MOUSE2" "+attack2" // right click
bind "MOUSE3" "slot3"  // knife, melee etc
bind "y" "slot12"    // health shot
bind "a" "slot5"   // explosives, bomb
bind "v" "slot2" // secondary weapon
bind "m" "buymenu"
bind "z" "+spray_menu"
bind "i" "+lookatweapon"
bind "h" "drop"
bind "r" "+use"
bind "t" "+reload"
//bind "ALT" "player_ping"
bind "END" "+voicerecord;use weapon_bumpmine" // mic/push-to-talk - actually a side mouse button



// Buy/use Nades
//
bind "g" "buy flashbang;slot7" // use weapon_flashbang
bind "q" "buy smokegrenade;slot8" // use weapon_smokegrenade
bind "w" "buy hegrenade;slot6" // - actually a side mouse button - use weapon_hegrenade
bind "c" "buy incgrenade;buy molotov;slot10"
bind "x" "slot9" // use weapon_decoy
bind "u" "slot4" // cycle utility


// Buy Weapons
//
bind "1" "buy ak47;buy m4a1;buy m4a1_silencer;give weapon_ak47;give weapon_m4a1;give weapon_m4a1_silencer;slot1"
bind "2" "buy sg556;buy aug;give weapon_sg556;give weapon_aug;slot1"
bind "3" "buy vest"
bind "4" "buy vesthelm"
bind "5" "buy defuser"
bind "6" "buy awp;give weapon_awp;slot1"
bind "7" "buy deagle;give weapon_deagle;slot2"
bind "8" "buy taser;give weapon_taser"
bind "9" "buy mp9;buy mac10;give weapon_mac10;give weapon_mp9;slot1"
bind "0" "buy mp5sd;give weapon_mp5sd;give weapon_mp7;slot1"
//bind "F1" //"buy P250;give weapon_p250;slot2" // voting is now broken if Fn keys are bound
//bind "F2" //"buy fiveseven;buy tec9;give weapon_fiveseven;give weapon_tec9;slot2"
bind "F3" "buy ssg08;give weapon_ssg08; slot1"
bind "F4" "buy galilar;buy famas;give weapon_galilar;give weapon_famas;slot1"
bind "F6" "buy g3sg1; buy scar20;give weapon_g3sg1;give weapon_scar20;getout"
cl_dm_buyrandomweapons "0"
cl_use_opens_buy_menu "0"



bind "F5" "jpeg"
bind "F7" "toggle cl_showfps 1 2 0" // toggle FPS display
bind "F8" "bot_kick"
bind "F9" "bot_add_t"
bind "F10" "bot_add_ct"
bind "F11" "toggleconsole"
bind "F12" "teammenu"
bind "`" "toggleconsole"
con_enable "1"




// Map Exploiration etc
//
bind "\" "sv_cheats 1;toggle sv_infinite_ammo 1 0;mp_ignore_round_win_conditions 1;mp_respawn_on_death_ct 1;mp_respawn_on_death_t 1;mp_freezetime 0;mp_autokick 0;mp_warmup_end;mp_do_warmup_period 0;sv_regeneration_force_on 1"
bind "/" "give weapon_hegrenade;give weapon_smokegrenade;give weapon_molotov"
alias "impacts" "say impacts, time;toggle sv_showimpacts 2 3 0;toggle sv_showimpacts_time 8 0.1 4"
bind "j" "noclip;playvol buttons/combine_button1 .6"
sv_noclipspeed 1600 // 1200 default


// Toggle offline bhop settings
//
alias "bhah" "sv_autobunnyhopping 1;sv_enablebunnyhopping 1;say_team bhop and autohop;alias bhop nobh"
alias "nobh" "sv_autobunnyhopping 0;sv_enablebunnyhopping 0;say_team bhop disabled;alias bhop bhah"
alias "bhop" "bhah" // bind a key or just type bhop in console to quickly change bhop settings


// Make current game Knife Only
alias "knives" "mp_free_armor 1;mp_solid_teammates 1;mp_freezetime 2;mp_t_default_secondary weapon_knife;mp_ct_default_secondary weapon_knife;mp_t_default_primary weapon_knife;mp_ct_default_primary weapon_knife;bot_knives_only 1;mp_buy_allow_grenades 0;mp_buy_allow_guns 0;mp_buytime 0; mp_buy_during_immunity 0;mp_drop_knife_enable 1;mp_weapons_allow_map_placed 1"




// Network, Misc
//
cl_obs_interp_enable "0"  // disable weird smooth tweening on spectator camera when changing player
cl_net_buffer_ticks "0"  // was 1, min number of ticks to buffer. min 0, max 2.
//cl_interp "0.015625"  // was 0.0, default 0.1? seems to set automatically after cl_interp_ratio
cl_interp_ratio "2"    // was 0.0, default 2?
cl_silencer_mode "0"  // disable detaching supressors
alias "dc" "disconnect"
alias "exe" "exec cs2exec"
alias "gfx" "sys_info" // print game, hardware and software info to console
//ui_vanitysetting_loadoutslot_t grenade3 // lol // 0=flash? 1=smoke? 2=he 3=molotov - BROKEN now :(
echo "--- cs2exec.cfg executed ---"
